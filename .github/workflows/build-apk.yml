name: Build Android APK

# Publica la APK en GitHub Releases. Enlace fijo a la última versión:
# https://github.com/jorgemc174/anime-countdown-pwa/releases/latest/download/AniCountdown.apk
# Los horarios los descarga la app de internet: solo se recompila si cambia lo
# que va dentro de la APK, no con cada actualización de schedule.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - schedule-policy.js
      - platform-policy.js
      - config.js
      - styles.css
      - sw.js
      - manifest.json
      - icons/**
      - android/**
      - capacitor.config.json
      - package.json
      - package-lock.json
      - scripts/build-www.js
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  apk:
    # Solo main puede compilar con la clave y publicar, también al lanzarlo a mano.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - run: npm test
      - name: Package current web app and native plugins
        run: npm run cap:sync
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            base64 -d <<<"$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
            bash android/gradlew -p android :app:assembleRelease --no-daemon --max-workers=2
            rm -f "$ANDROID_KEYSTORE_PATH"
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AniCountdown.apk"
          else
            echo "::warning::Sin clave fija: firma debug, cada versión exige desinstalar la anterior"
            bash android/gradlew -p android :app:assembleDebug --no-daemon --max-workers=2
            cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AniCountdown.apk"
          fi
      - name: Verify APK signature and package
        run: |
          APK="$RUNNER_TEMP/AniCountdown.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='$APP_VERSION_CODE'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AniCountdown-apk
          path: ${{ runner.temp }}/AniCountdown.apk
          if-no-files-found: error
          retention-days: 1

  # Único trabajo con permiso de escritura: no ejecuta código del repo ni dependencias.
  publish:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AniCountdown-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$APP_VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AniCountdown.apk --clobber
          else
            gh release create "$TAG" AniCountdown.apk --target "$GITHUB_SHA" --latest \
              --title "AniCountdown $APP_VERSION_NAME" \
              --notes "APK para Android compilada automáticamente desde ${GITHUB_SHA::7}."
          fi
